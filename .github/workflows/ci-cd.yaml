name: HTML Project Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Check hello.html exists
        run: |
          if [ -f hello.html ]; then
            echo "hello.html found "
          else
            echo "hello.html missing "
            exit 1
          fi

      - name: Check README exists
        run: |
          if [ -f README.md ]; then
            echo "README found "
          else
            echo "README missing "
            exit 1
          fi

